name: CI

on:
  pull_request:
    branches: [master]

jobs:
  test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 3.28+
        run: |
          python3 -m pip install --user --no-cache-dir cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            software-properties-common ca-certificates gnupg \
            build-essential ninja-build pkg-config zip \
            protobuf-compiler libprotobuf-dev \
            libgrpc++-dev protobuf-compiler-grpc \
            libsamplerate0-dev libsimde-dev
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y \
            libobs-dev

      - name: Show tool versions
        run: |
          cmake --version
          protoc --version

      - name: Configure
        run: cmake --preset ubuntu-x86_64

      - name: Build
        run: cmake --build --preset ubuntu-x86_64
