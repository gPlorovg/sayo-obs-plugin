name: CI

on:
  pull_request:
    branches: [master]

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            software-properties-common ca-certificates cmake gnupg \
            build-essential ninja-build pkg-config zip \
            protobuf-compiler libprotobuf-dev \
            libgrpc++-dev protobuf-compiler-grpc \
            libsamplerate0-dev libsimde-dev
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y \
            libobs-dev

      - name: Show tool versions
        run: |
          cmake --version
          protoc --version
          dpkg-query -W -f='libobs-dev ${Version}\n' libobs-dev

      - name: Configure
        run: cmake --preset ubuntu-x86_64

      - name: Build
        run: cmake --build --preset ubuntu-x86_64
