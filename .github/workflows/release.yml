name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release-linux:
    # Matches the official obs-plugintemplate Linux CI environment.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag is on default branch
        run: |
          git fetch origin master main 2>/dev/null || true
          ok=false
          for b in master main; do
            if git rev-parse --verify "origin/$b" >/dev/null 2>&1; then
              if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$b"; then
                ok=true
                echo "Tag ${GITHUB_REF_NAME} is reachable from origin/$b"
                break
              fi
            fi
          done
          if [ "$ok" != "true" ]; then
            echo "Tag ${GITHUB_REF_NAME} must point to a commit reachable from origin/master or origin/main."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates gnupg software-properties-common
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates cmake extra-cmake-modules git ninja-build pkg-config zip \
            protobuf-compiler libprotobuf-dev \
            libgrpc++-dev protobuf-compiler-grpc \
            libsamplerate0-dev libsimde-dev \
            libobs-dev \
            libglib2.0-dev libjansson-dev libcurl4-openssl-dev \
            libx11-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev libxcb-composite0-dev \
            libxcomposite-dev libxinerama-dev libxrandr-dev libxss-dev \
            libxcb1-dev libx11-xcb-dev libxcb-xfixes0-dev \
            libwayland-dev libxkbcommon-dev libglvnd-dev libpci-dev \
            uthash-dev libmbedtls-dev libx264-dev libcmocka-dev \
            libatk1.0-dev libatk-bridge2.0-dev libxdamage-dev \
            libasound2-dev libfontconfig-dev libfreetype6-dev libjack-jackd2-dev \
            libsndio-dev libspeexdsp-dev libvlc-dev \
            nlohmann-json3-dev libwebsocketpp-dev libasio-dev libqrcodegencpp-dev \
            librist-dev libsrt-openssl-dev libvpl-dev libvpl2 \
            libpulse-dev libpipewire-0.3-dev libudev-dev libv4l-dev \
            libdrm-dev libva-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev \
            python3 python3-dev swig libluajit-5.1-dev
      - name: Show tool versions
        run: |
          cmake --version
          protoc --version
          pkg-config --modversion libavformat
          pkg-config --atleast-version=6.1 libavformat
          dpkg-query -W -f='libobs-dev ${Version}\n' libobs-dev

      - name: Configure + Build
        run: |
          cmake --preset ubuntu-x86_64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build --preset ubuntu-x86_64

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          obs_version="$(dpkg-query -W -f='${Version}' libobs-dev | cut -d: -f2)"
          obs_major="${obs_version%%.*}"
          package_file="sayo-obs-plugin-linux-x86_64-obs${obs_major}-${version}.zip"

          mkdir -p "package/sayo-obs-plugin/bin/64bit"
          mkdir -p dist
          cp build_x86_64/sayo_obs_plugin.so "package/sayo-obs-plugin/bin/64bit/"
          cp README.md README_ru.md "package/sayo-obs-plugin/"

          ldd "package/sayo-obs-plugin/bin/64bit/sayo_obs_plugin.so"
          if ldd "package/sayo-obs-plugin/bin/64bit/sayo_obs_plugin.so" | grep -q "not found"; then
            echo "Missing runtime dependency in packaged plugin"
            exit 1
          fi

          (cd package && zip -r "../dist/${package_file}" sayo-obs-plugin)

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  release-windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag is on default branch
        shell: pwsh
        run: |
          git fetch origin master main 2>$null
          $ok = $false
          foreach ($branch in @("master", "main")) {
            git rev-parse --verify "origin/$branch" *> $null
            if ($LASTEXITCODE -ne 0) {
              continue
            }

            git merge-base --is-ancestor "$env:GITHUB_SHA" "origin/$branch"
            if ($LASTEXITCODE -eq 0) {
              $ok = $true
              Write-Host "Tag $env:GITHUB_REF_NAME is reachable from origin/$branch"
              break
            }
          }

          if (-not $ok) {
            throw "Tag $env:GITHUB_REF_NAME must point to a commit reachable from origin/master or origin/main."
          }

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:RUNNER_TEMP/vcpkg".Replace("\", "/")
          git clone https://github.com/microsoft/vcpkg.git "$vcpkgRoot"
          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Build latest OBS Studio libobs
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/obsproject/obs-studio.git C:/obs-studio
          git -C C:/obs-studio fetch --tags --force

          $obsTag = git -C C:/obs-studio tag --list "[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | Select-Object -First 1
          if (-not $obsTag) {
            throw "Could not find latest OBS release tag"
          }

          $obsMajor = ($obsTag -split "\.")[0]
          Write-Host "Building libobs against OBS tag: $obsTag"
          git -C C:/obs-studio checkout --force "$obsTag"
          git -C C:/obs-studio submodule update --init --recursive --depth 1

          cmake -S C:/obs-studio -B C:/obs-studio/build_x64 `
            -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_BROWSER=OFF `
            -DENABLE_PLUGINS=OFF `
            -DENABLE_VST=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_UI=OFF
          cmake --build C:/obs-studio/build_x64 --config RelWithDebInfo --target libobs

          "OBS_STUDIO_DIR=C:/obs-studio" >> $env:GITHUB_ENV
          "OBS_TAG=$obsTag" >> $env:GITHUB_ENV
          "OBS_MAJOR=$obsMajor" >> $env:GITHUB_ENV

      - name: Configure + Build
        shell: pwsh
        run: |
          cmake --preset windows-x64
          cmake --build --preset windows-x64

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $packageFile = "sayo-obs-plugin-windows-x64-obs$env:OBS_MAJOR-$version.zip"
          $packageDir = "package/sayo-obs-plugin/bin/64bit"

          New-Item -ItemType Directory -Force $packageDir, "dist" | Out-Null

          $buildDir = "build_x64/RelWithDebInfo"
          $requiredFiles = @(
            "sayo_obs_plugin.dll",
            "abseil_dll.dll",
            "cares.dll",
            "libcrypto-3-x64.dll",
            "libprotobuf.dll",
            "libssl-3-x64.dll",
            "re2.dll",
            "samplerate.dll",
            "z.dll"
          )

          foreach ($file in $requiredFiles) {
            $src = Join-Path $buildDir $file
            if (-not (Test-Path $src)) {
              throw "Required runtime file is missing: $src"
            }
            Copy-Item -Force $src $packageDir
          }

          Copy-Item -Force README.md, README_ru.md "package/sayo-obs-plugin/"
          Compress-Archive -Force -Path "package/sayo-obs-plugin" -DestinationPath "dist/$packageFile"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [release-linux, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag is on default branch
        run: |
          git fetch origin master main 2>/dev/null || true
          ok=false
          for b in master main; do
            if git rev-parse --verify "origin/$b" >/dev/null 2>&1; then
              if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$b"; then
                ok=true
                echo "Tag ${GITHUB_REF_NAME} is reachable from origin/$b"
                break
              fi
            fi
          done
          if [ "$ok" != "true" ]; then
            echo "Tag ${GITHUB_REF_NAME} must point to a commit reachable from origin/master or origin/main."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/**/*.zip
